<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>16:9 Prod</title>
    <link rel="icon" href="assets/ico/Logo-BLCK.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Afacad+Flux:wght@100..1000&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
    <header>
        <img class="logo" src="assets/Branding/Logo Large.png" alt="Logo BLCK">
    </header>
    <section class="hero" id="hero">
        <div id="hero-content" class="hero-content">
            <div class="slide">
                <img class="hero-image" src="assets/Affiche/Large/Hope - Large.png" alt="Hero Image">
            </div>
            <div class="slide">
                <img class="hero-image" src="assets/Affiche/Large/2 Dreams 2 Nightmare - Large.png" alt="Hero Image">
            </div>
            <div class="slide">
                <img class="hero-image" src="assets/Affiche/Large/Contre Soirée - Large.png" alt="Hero Image">
            </div>
            <div class="slide">
                <img class="hero-image" src="assets/Affiche/Large/New Era - Large.png" alt="Hero Image">
            </div>
            <div class="slide">
                <img class="hero-image" src="assets/Affiche/Large/On Papote! - Large.png" alt="Hero Image">
            </div>
            <div class="slide">
                <img class="hero-image" src="assets/Affiche/Large/Rencontre Accidentelle - Large.png" alt="Hero Image">
            </div>

    <section class="tagline">
        <h1 class="tagline">We Love Making Vidéos<span class="point-rouge">.</span></h1>
    </section>

    <section class="casette" id="casette">

    </section>
    
    <!--GSAP LIBRARY-->
    <script src="JS/GSAP/gsap.min.js"></script>
    <script src="JS/GSAP/ScrollTrigger.min.js"></script>
    <script src="JS/GSAP/ScrollToPlugin.min.js"></script>
    <script src="JS/GSAP/Draggable.min.js"></script>
    <script src="JS/GSAP/MotionPathPlugin.min.js"></script>

    <!--JS MAIN-->
    <script src="JS/main.js"></script>
